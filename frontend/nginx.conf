server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # NOTE: This server only serves the built SPA. API and Socket.IO requests go
    # directly to the backend's public URL, configured at build time via
    # VITE_API_URL (see src/api/axios.ts, src/config/api.ts, src/stores/portalSocket.ts).
    # There is intentionally no /api proxy here so nginx does not depend on an
    # internal "backend" host (which does not exist on Railway).

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
